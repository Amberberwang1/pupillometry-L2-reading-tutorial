name: tests
# Runs on pull requests, on pushes to main and by hand. In a private repository, macOS minutes count ten times and
# Windows minutes twice against the free allowance, so those two systems test one Python version each.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install .[test]
      - run: pytest -q
  r-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("lme4", "mgcv"))'
      - run: pip install .[test]
      - run: pytest -q -k "r_scripts or r_boxes"
